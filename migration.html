<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Badgeuse : e-mails de mot de passe</title>
<style>
  :root { --ink:#1d2a33; --muted:#5d6b75; --line:#d5dedb; --brand:#1f5f5b; --ok:#237a3f; --warn:#a15c00; --bad:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; background:#eef2f1; color:var(--ink); font:16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  .intro { color:var(--muted); margin:0 0 24px; max-width:62ch; }
  section { background:#fff; border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:6px; padding:20px 22px; margin-bottom:16px; }
  label { display:block; font-size:.9rem; font-weight:600; margin:10px 0 4px; }
  input[type=email], input[type=password] { width:100%; max-width:380px; padding:9px 11px; font:inherit; border:1px solid var(--line); border-radius:4px; }
  button { margin-top:14px; padding:10px 18px; font:inherit; font-weight:600; background:var(--brand); color:#fff; border:0; border-radius:4px; cursor:pointer; }
  button:disabled { background:#9fb3b1; cursor:not-allowed; }
  button:focus-visible, input:focus-visible { outline:3px solid #7fb8b3; outline-offset:2px; }
  .status { margin-top:12px; font-size:.95rem; white-space:pre-line; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .list label { font-weight:400; display:flex; gap:10px; align-items:center; margin:6px 0; }
  .list small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>E-mails de mot de passe</h1>
  <p class="intro">La migration est terminée. Cette page envoie à chaque salarié coché un e-mail pour choisir
  son mot de passe dans la badgeuse. Elle ne copie ni ne modifie aucune donnée.</p>

  <section>
    <label for="email">E-mail administrateur</label>
    <input id="email" type="email" value="contact@ag-groupe.fr" autocomplete="username">
    <label for="pass">Mot de passe de la badgeuse</label>
    <input id="pass" type="password" autocomplete="current-password">
    <br><button id="login">Afficher les salariés</button>
    <div id="st1" class="status"></div>
  </section>

  <section id="s2" hidden>
    <div id="list" class="list"></div>
    <button id="send">Envoyer les e-mails</button>
    <div id="st2" class="status"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const app = firebase.initializeApp({
  apiKey: "AIzaSyCpmetPQ8-S59r8nkbFRUCWLeSKMn0KCeM",
  authDomain: "agloc-edl.firebaseapp.com",
  projectId: "agloc-edl",
  storageBucket: "agloc-edl.firebasestorage.app",
  messagingSenderId: "905072085291",
  appId: "1:905072085291:web:35fdc7c1c356d6c5135d6e"
}, 'mails');
const auth = app.auth(), db = app.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
auth.languageCode = 'fr';

// Personnes qui ont déjà leur mot de passe
const ALREADY_SET = ['contact@ag-groupe.fr', 'clemence.girardeau@ag-groupe.fr'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function status(el, msg, kind) { $(el).className = 'status ' + (kind || ''); $(el).textContent = msg; }
function authError(e) {
  const c = (e && e.code) || '';
  if (c.includes('wrong-password') || c.includes('invalid-login') || c.includes('invalid-credential')) return 'E-mail ou mot de passe incorrect.';
  if (c.includes('too-many-requests')) return 'Trop de tentatives. Patientez quelques minutes puis réessayez.';
  return (e && e.message) || String(e);
}

$('login').onclick = async () => {
  $('login').disabled = true;
  status('st1', 'Connexion…');
  try {
    await auth.signInWithEmailAndPassword($('email').value.trim(), $('pass').value);
    const snap = await db.collection('users').get();
    const people = snap.docs.map(d => d.data())
      .filter(u => u.email)
      .sort((a, b) => String(a.name).localeCompare(String(b.name)));
    $('list').innerHTML = people.map(u => {
      const email = u.email.trim().toLowerCase();
      const skip = ALREADY_SET.includes(email) || u.active === false;
      return `<label><input type="checkbox" value="${esc(email)}" ${skip ? '' : 'checked'}>
        <span>${esc(u.name)} <small>${esc(email)}${ALREADY_SET.includes(email) ? ' (a déjà son mot de passe)' : ''}${u.active === false ? ' (inactif)' : ''}</small></span></label>`;
    }).join('');
    status('st1', `${people.length} salariés trouvés.`, 'ok');
    $('s2').hidden = false;
  } catch (e) {
    status('st1', authError(e), 'bad');
    $('login').disabled = false;
  }
};

$('send').onclick = async () => {
  const emails = [...document.querySelectorAll('#list input:checked')].map(i => i.value);
  if (!emails.length) return status('st2', 'Cochez au moins un salarié.', 'warn');
  if (!confirm(`Envoyer un e-mail de mot de passe à ${emails.length} salarié(s) ?`)) return;
  $('send').disabled = true;
  const failed = [];
  for (const e of emails) {
    try { await auth.sendPasswordResetEmail(e); } catch (err) { failed.push(`${e} : ${authError(err)}`); }
  }
  status('st2', failed.length
    ? `E-mails envoyés, sauf pour :\n- ${failed.join('\n- ')}`
    : `E-mails envoyés à ${emails.length} salarié(s).`, failed.length ? 'warn' : 'ok');
};
</script>
</body>
</html>
